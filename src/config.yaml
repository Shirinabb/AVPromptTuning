# ===========================
# CONFIG FILE for AVPromptTuning
# ===========================

general:
  epochs: 3
  batch_size: 8
  lr: 2e-5          # عدد، نه رشته
  max_len: 128
  num_labels: 4
  eval_steps: 100
  seed_base: 42
  device: "auto"    # "auto" یا "cpu" یا "cuda"
  save_dir: "results/"

models:
  bert:
    pretrained: "bert-base-uncased"
  gpt2:
    pretrained: "gpt2"
  salmon:            # placeholder; اگر مدل واقعی دارید، نامش را بگذارید
    pretrained: "bert-base-uncased"
  salmonn:           # placeholder؛ در صورت نبود می‌توانید موقت حذفش کنید
    pretrained: "bert-base-uncased"

modes:
  - baseline
  - context
  - prioritize
  - full
