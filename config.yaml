# ===========================
# CONFIG FILE for AVPromptTuning
# ===========================

general:
  epochs: 3
  batch_size: 8
  lr: 2e-5
  max_len: 128
  num_labels: 4
  eval_steps: 100
  seed_base: 42
  device: "cuda"   # or "cpu"
  save_dir: "results/"

models:
  bert:
    pretrained: "bert-base-uncased"
  gpt2:
    pretrained: "gpt2"
  salmon:
    pretrained: "bert-base-uncased"   # placeholder; adjust to real model
  salmonn:
    pretrained: "bert-base-uncased"   # placeholder; adjust if available

modes:
  - baseline
  - context
  - prioritize
  - full
